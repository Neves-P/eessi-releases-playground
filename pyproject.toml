[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eessi-revisions"
version = "0.0.0"
description = "Tools for creating coordinated, citable EESSI revisions"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
citation = [
    "cffconvert>=2.0,<3",
]
dev = [
    "basedpyright",
    "ruff>=0.12",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
eessi-github-release = "eessi_revisions.github_release:main"
eessi-zenodo-lookup = "eessi_revisions.zenodo_lookup:main"
eessi-create-cff = "eessi_revisions.citation:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eessi_revisions*"]

[tool.basedpyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
extraPaths = ["src"]
include = [
    "src",
    "tests",
]
exclude = [
    ".venv",
]

[tool.ruff]
target-version = "py39"
line-length = 79

[tool.ruff.lint]
future-annotations = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
