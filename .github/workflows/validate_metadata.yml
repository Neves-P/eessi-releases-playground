name: Validate metadata

on:
  push:
    paths:
      - '.zenodo.json'

jobs:
  validate-citation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[citation]"

    - name: Run script to update CITATION.cff
      id: run_script
      run: eessi-create-cff

    - name: Check script exit status
      if: steps.run_script.outcome != 'success'
      run: exit 1
